name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag matches package version
        run: test "v$(npm pkg get version | tr -d '\"')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install --yes expect libsecret-1-0
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance
